services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixelshift
      POSTGRES_USER: pixelshift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixelshift}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelshift -d pixelshift"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pixelshift:${POSTGRES_PASSWORD:-pixelshift}@db:5432/pixelshift
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5180}
      PORT: 8000
    depends_on:
      db: {condition: service_healthy}
    ports: ["8020:8000"]
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports: ["5180:80"]
volumes:
  postgres-data:
